name: HomeMatch Monorepo CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-ci:
    name: Backend Build & Tests (.NET 10)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          # Disposable CI-only credentials; the bootstrap role can create test databases.
          POSTGRES_USER: homematch_test_admin
          POSTGRES_PASSWORD: homematch_ci_test_password
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U homematch_test_admin -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore backend/HomeMatch.sln

      - name: Build Solution
        run: dotnet build backend/HomeMatch.sln --no-restore --configuration Release

      - name: Run Tests
        env:
          HOMEMATCH_TEST_POSTGRES_CONNECTION: >-
            Host=127.0.0.1;Port=${{ job.services.postgres.ports[5432] }};Database=postgres;Username=homematch_test_admin;Password=homematch_ci_test_password;Timeout=10;Command Timeout=30
        run: dotnet test backend/HomeMatch.sln --no-build --configuration Release --verbosity normal

  frontend-ci:
    name: Frontend Lint & Build (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Type check & Build
        working-directory: ./frontend
        run: npm run build

  docker-ci:
    name: Validate Docker Compose Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Compose File
        run: docker compose config
