services:
  db:
    image: postgis/postgis:16-3.4
    container_name: homematch-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-homematch_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-homematch_password}
      POSTGRES_DB: ${POSTGRES_DB:-homematch_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-homematch_user} -d ${POSTGRES_DB:-homematch_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - homematch-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: homematch-backend
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:5000
      - Jwt__Secret=${Jwt__Secret:-}
      - Jwt__Issuer=${Jwt__Issuer:-HomeMatch}
      - Jwt__Audience=${Jwt__Audience:-HomeMatchApp}
      - Jwt__ExpirationMinutes=${Jwt__ExpirationMinutes:-15}
      - Jwt__ClockSkewSeconds=${Jwt__ClockSkewSeconds:-30}
      - Cors__AllowedOrigins__0=${Cors__AllowedOrigins__0:-http://localhost:3000}
      - Cors__AllowedOrigins__1=${Cors__AllowedOrigins__1:-http://localhost:5000}
      - Cors__AllowedOrigins__2=${Cors__AllowedOrigins__2:-http://127.0.0.1:5000}
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${POSTGRES_DB:-homematch_db};Username=${POSTGRES_USER:-homematch_user};Password=${POSTGRES_PASSWORD:-homematch_password};
      - Identity__EmailVerification__Enabled=${Identity__EmailVerification__Enabled:-true}
      - Identity__EmailVerification__KeyId=${Identity__EmailVerification__KeyId:-v1}
      - Identity__EmailVerification__Keys__v1=${Identity__EmailVerification__Keys__v1:-}
      - Email__Enabled=${Email__Enabled:-true}
      - Email__Smtp__Host=${Email__Smtp__Host:-smtp.gmail.com}
      - Email__Smtp__Port=${Email__Smtp__Port:-587}
      - Email__Smtp__Security=${Email__Smtp__Security:-StartTls}
      - Email__Smtp__Username=${Email__Smtp__Username:-}
      - Email__Smtp__FromAddress=${Email__Smtp__FromAddress:-}
      - Email__Smtp__AppPassword=${Email__Smtp__AppPassword:-}
      - Email__Smtp__FromName=${Email__Smtp__FromName:-HomeMatch}
      - Email__Smtp__TimeoutSeconds=${Email__Smtp__TimeoutSeconds:-15}
    ports:
      - "${API_PORT:-5000}:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - homematch-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: homematch-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:${API_PORT:-5000}
      - API_INTERNAL_URL=http://backend:5000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - homematch-network

networks:
  homematch-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
