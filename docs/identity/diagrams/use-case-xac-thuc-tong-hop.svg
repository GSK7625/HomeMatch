<text x="850" y="1600" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="20" font-weight="400" fill="#64748b">Actor lặp lại để dễ đọc; đường nối thể hiện tham gia, không phải thứ tự xử lý.</text>
