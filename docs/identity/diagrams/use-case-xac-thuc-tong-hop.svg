<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="1640" viewBox="0 0 1700 1640"><rect width="100%" height="100%" fill="white"/>
<text x="850" y="45" text-anchor="middle" dominant-baseline="central" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#183b63">HOMEMATCH — BIỂU ĐỒ USE CASE XÁC THỰC</text>
