services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: homematch-jenkins
    restart: unless-stopped
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      - JENKINS_OPTS=--httpPort=8080
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - homematch-ci-network

networks:
  homematch-ci-network:
    name: homematch-ci-network
    driver: bridge

volumes:
  jenkins_data:
    name: homematch_jenkins_data
    driver: local
